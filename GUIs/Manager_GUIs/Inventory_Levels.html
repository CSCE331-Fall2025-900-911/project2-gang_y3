<!DOCTYPE html>
<html>

<head>
    <title>Inventory Levels</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .inventory-container {
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        .category {
            margin-bottom: 30px;
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ddd;
            padding: 8px 12px;
            font-weight: bold;
            font-size: 18px;
            border-radius: 6px;
        }

        .items {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .item {
            text-align: center;
            border-radius: 6px;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
        }

        .normal {
            background: #f4f4f4;
        }

        .low {
            background: yellow;
        }

        .critical {
            background: red;
            color: white;
        }

        .count {
            display: block;
            margin-top: 8px;
            font-size: 14px;
            font-weight: normal;
        }

        .sort-btn {
            background: black;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="inventory-container">
        <h1>Boba Shop Inventory</h1>

        <div class="category">
            <div class="category-header">
                <span>Milk</span>
                <button class="sort-btn">Descending</button>
            </div>
            <div class="items">
                <div class="item normal">Whole Milk <span class="count">21</span></div>
                <div class="item low">Almond <span class="count">13</span></div>
                <div class="item normal">Oat <span class="count">5</span></div>
                <div class="item normal">Soy <span class="count">5</span></div>
                <div class="item critical">Coconut <span class="count">2</span></div>
            </div>
        </div>

        <div class="category">
            <div class="category-header">
                <span>Boba</span>
                <button class="sort-btn">Ascending</button>
            </div>
            <div class="items">
                <div class="item critical">Tapioca <span class="count">1</span></div>
                <div class="item low">Popping <span class="count">8</span></div>
                <div class="item low">Taro <span class="count">10</span></div>
                <div class="item normal">Lychee <span class="count">25</span></div>
                <div class="item normal">Strawberry <span class="count">30</span></div>
            </div>
        </div>

        <div class="category">
            <div class="category-header">
                <span>Utensils</span>
                <button class="sort-btn">Alphabetical</button>
            </div>
            <div class="items">
                <div class="item normal">Cups <span class="count">350</span></div>
                <div class="item normal">Ice <span class="count">67</span></div>
                <div class="item normal">Lids <span class="count">450</span></div>
                <div class="item critical">Napkins <span class="count">15</span></div>
                <div class="item normal">Straw <span class="count">670</span></div>
            </div>
        </div>
    </div>
</body>

</html>
