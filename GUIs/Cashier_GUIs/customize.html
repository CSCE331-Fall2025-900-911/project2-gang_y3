<!DOCTYPE html>
<html>

<head>
    <title>Customize Drink</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1 id="drinkName"></h1>
    </header>
    <div class="container">
        <div class="main" style="grid-template-columns: 1fr;">
            <div>
                <h2>Sweetness</h2>
                <label><input type="radio" name="sweetness" value="0%">0%</label>
                <label><input type="radio" name="sweetness" value="25%">25%</label>
                <label><input type="radio" name="sweetness" value="50%">50%</label>
                <label><input type="radio" name="sweetness" value="100%" checked>100%</label>
            </div>
            <div>
                <h2>Ice Level</h2>
                <label><input type="radio" name="ice" value="0%">0%</label>
                <label><input type="radio" name="ice" value="25%">25%</label>
                <label><input type="radio" name="ice" value="50%">50%</label>
                <label><input type="radio" name="ice" value="100%" checked>100%</label>
            </div>
            <button class="add-btn" onclick="addToCart()">Add to Cart</button>
        </div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const item = params.get("item");
        document.getElementById("drinkName").textContent = item;

        function addToCart() {
            const sweet = document.querySelector('input[name="sweetness"]:checked').value;
            const ice = document.querySelector('input[name="ice"]:checked').value;
            let order = JSON.parse(localStorage.getItem("order") || "[]");
            order.push({ name: item, sweetness: sweet, ice: ice });
            localStorage.setItem("order", JSON.stringify(order));
            location.href = "index.html";
        }
    </script>
</body>

</html>
