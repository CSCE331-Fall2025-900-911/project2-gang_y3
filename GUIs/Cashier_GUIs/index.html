<!DOCTYPE html>
<html>

<head>
  <title>Boba POS</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>Boba Shop</h1>
    <button onclick="location.href='order.html'">View Order</button>
  </header>
  <div class="container">
    <div class="sidebar">
      <h2>Order</h2>
      <div id="orderList"></div>
    </div>
    <div class="main">
      <button onclick="location.href='customize.html?item=Taro Milk Tea'">Taro Milk Tea</button>
      <button onclick="location.href='customize.html?item=Mango Tea'">Mango Tea</button>
      <button onclick="location.href='customize.html?item=Lychee Tea'">Lychee Tea</button>
      <button onclick="location.href='customize.html?item=Strawberry Tea'">Strawberry Tea</button>
      <button onclick="location.href='customize.html?item=Peach Tea'">Peach Tea</button>
      <button onclick="location.href='customize.html?item=Passionfruit Tea'">Passionfruit Tea</button>
    </div>
  </div>
  <script>
    function loadOrder() {
      let order = JSON.parse(localStorage.getItem("order") || "[]");
      let html = "";
      order.forEach(item => {
        html += `<div class="order-item">${item.name} (${item.sweetness}, ${item.ice})</div>`;
      });
      document.getElementById("orderList").innerHTML = html;
    }
    loadOrder();
  </script>
</body>

</html>
